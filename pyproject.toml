[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scamscript"
version = "0.6.1"
description = "Reverse-engineer scam scripts and vishing transcripts into structured counter-playbooks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "scamscript contributors", email = "313729361+sjdsjadjajdjsa@users.noreply.github.com" },
]
maintainers = [
  { name = "scamscript contributors", email = "313729361+sjdsjadjajdjsa@users.noreply.github.com" },
]
keywords = [
  "security",
  "fraud",
  "vishing",
  "smishing",
  "phishing",
  "social-engineering",
  "scam",
  "osint",
  "transcripts",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "typer==0.27.3",
  "rich==15.0.0",
  "httpx==0.28.1",
  "pydantic==2.14.2",
]

[project.urls]
Homepage = "https://github.com/sjdsjadjajdjsa/scamscript"
Repository = "https://github.com/sjdsjadjajdjsa/scamscript"
Issues = "https://github.com/sjdsjadjajdjsa/scamscript/issues"
Changelog = "https://github.com/sjdsjadjajdjsa/scamscript/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest==8.4.1", "build==1.3.0", "twine==6.1.0"]

[project.scripts]
scamscript = "scamscript.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scamscript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
